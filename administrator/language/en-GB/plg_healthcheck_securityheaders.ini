PLG_HEALTHCHECK_SECURITYHEADERS_FIX_COOP="Send Cross-Origin-Opener-Policy, for example same-origin. The System - HTTP Headers plugin can set it."
PLG_HEALTHCHECK_SECURITYHEADERS_FIX_CSP="Send a Content-Security-Policy. The System - HTTP Headers plugin can set one; test it in report-only mode first."
PLG_HEALTHCHECK_SECURITYHEADERS_FIX_FRAME="Send X-Frame-Options SAMEORIGIN or DENY, or a CSP frame-ancestors directive. The System - HTTP Headers plugin can set both."
PLG_HEALTHCHECK_SECURITYHEADERS_FIX_HSTS="Send Strict-Transport-Security with a max-age of at least 180 days (15552000). Browsers remember it, so start with a short max-age and raise it once every page works over HTTPS. The System - HTTP Headers plugin can set it."
PLG_HEALTHCHECK_SECURITYHEADERS_FIX_HSTS_HTTP="The homepage is not served over HTTPS, so browsers ignore HSTS. Install a certificate, serve the site over HTTPS, then turn on Force HTTPS in Global Configuration (Server)."
PLG_HEALTHCHECK_SECURITYHEADERS_FIX_LEAK="Hide version numbers in the Server and X-Powered-By headers (for example ServerTokens Prod in Apache, server_tokens off in nginx, expose_php = Off in PHP)."
PLG_HEALTHCHECK_SECURITYHEADERS_FIX_NOSNIFF="Joomla's htaccess.txt (Apache) and web.config.txt (IIS) already send X-Content-Type-Options: nosniff; rename the file to .htaccess or web.config. On nginx, add: add_header X-Content-Type-Options nosniff always;"
PLG_HEALTHCHECK_SECURITYHEADERS_FIX_PERMISSIONS="Send a Permissions-Policy that turns off browser features the site does not use, for example camera=(), microphone=(), geolocation=()."
PLG_HEALTHCHECK_SECURITYHEADERS_FIX_REFERRER="Send Referrer-Policy strict-origin-when-cross-origin (or stricter). The System - HTTP Headers plugin can set it."
